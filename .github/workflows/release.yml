name: Release
on:
  push:
    branches: [release]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: mf-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Select release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag=$(python3 scripts/release_version.py "$REF_TYPE" "$REF_NAME")
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Install FFmpeg for tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: sh -n scripts/install.sh && sh -n scripts/build.sh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test ./...
      - run: go vet ./...
      - name: Build executables and checksums
        run: make dist VERSION="$RELEASE_TAG"
      - name: Publish release after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reserve the tag before making a draft, so a failed upload cannot
          # let a later commit reuse the draft's version for different code.
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-is-draft; then
            if [[ "$(cat release-is-draft)" == false ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/mf-* dist/install.sh --clobber
          else
            gh release create "$RELEASE_TAG" dist/mf-* dist/install.sh --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
